# Packages allowed to run install scripts. pnpm blocks the rest by default,
# which stops a compromised dependency from running code on your computer.
allowBuilds:
  inngest-cli: true
  unrs-resolver: true
  protobufjs: false
minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.113'
  - '@supabase/cli-darwin-arm64@2.121.0'
  - '@supabase/cli-darwin-x64@2.121.0'
  - '@supabase/cli-linux-arm64-musl@2.121.0'
  - '@supabase/cli-linux-arm64@2.121.0'
  - '@supabase/cli-linux-x64-musl@2.121.0'
  - '@supabase/cli-linux-x64@2.121.0'
  - '@supabase/cli-windows-arm64@2.121.0'
  - '@supabase/cli-windows-x64@2.121.0'
  - ai@7.0.140
  - inngest@4.24.0
  - resend@6.33.0
  - supabase@2.121.0
